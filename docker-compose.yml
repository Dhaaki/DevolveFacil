services:
  postgres:
    image: postgres:15-alpine
    container_name: devolvefacill-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devolvefacill}
      POSTGRES_USER: ${POSTGRES_USER:-devolvefacill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devolvefacill}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devolvefacill}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: devolvefacill-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"    # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: devolvefacill-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Src/DevolveFacill.Api/Dockerfile
    container_name: devolvefacill-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRES_DB:-devolvefacill};Username=${POSTGRES_USER:-devolvefacill};Password=${POSTGRES_PASSWORD:-devolvefacill}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - Storage__Provider=${STORAGE_PROVIDER:-S3}
      - Storage__S3__ServiceUrl=http://minio:9000
      - Storage__S3__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Storage__S3__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Storage__S3__BucketName=devolvefacill
      - Jwt__Key=${JWT_KEY:-change_me_32_chars_minimum_secret}
      - Commerce__Provider=${COMMERCE_PROVIDER:-Mock}
      - Carrier__Provider=${CARRIER_PROVIDER:-Mock}
      - Erp__Provider=${ERP_PROVIDER:-Mock}
      - Seed__AdminEmail=${SEED_ADMIN_EMAIL:-admin@lamoda.com.br}
      - Seed__AdminName=${SEED_ADMIN_NAME:-Administrador}
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD}
      - Seed__AdminRole=${SEED_ADMIN_ROLE:-Supervisor}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: devolvefacill-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
